<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Static Render Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      height: 100%;
      overflow: hidden;
      font-family: 'ABCGravity', sans-serif;
      color: white;
      touch-action: manipulation;
    }

#viewer {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}
#image-wrapper {
  position: relative; /* allow inner buttons to position themselves */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  overflow: hidden;
}


#displayed-image {
  max-width: 100vw;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}

    #image-label {
      font-size: 1rem;
      margin-top: 8px;
      text-align: center;
      color: white;
      max-width: 90vw;
      word-break: break-word;
    }

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.5rem;
  color: white;
  background: none;
  border: none;
  padding: 0.5rem;
  cursor: pointer;
  z-index: 10;
}
    .arrow:active {
      opacity: 0.5;
    }

#prev {
  left: clamp(10px, 3vw, 30px);
}

#next {
  right: clamp(10px, 3vw, 30px);
}
  </style>
</head>
<body>
<div id="viewer">
  <button class="arrow" id="prev">&lt;</button>
  <div id="image-wrapper">
    <img id="displayed-image" src="" alt="Image Viewer" />
    <div id="image-label"></div>
  </div>
  <button class="arrow" id="next">&gt;</button>
</div>
</div>

  <script>
    const imageList = [
      { src: 'boulevard_11.jpg', label: 'Boulevard View' },
      { src: 'east_02.jpg', label: 'East Entrance' },
      { src: 'event_space_07.jpg', label: 'Event Space Interior' },
      { src: 'looking_up_17_dusk.jpg', label: 'Looking Up at Dusk' },
      { src: 'street_elevation_11.jpg', label: 'Street Elevation' },
      { src: 'street_level_12.jpg', label: 'Street Level View' },
      { src: 'XC190-HdM637_IM_2406_IM07_Tower view_013d.jpg', label: 'Tower View 1' },
      { src: 'XC190-HdM637_IM_2412_IM17_Rooftop_pool_3_004b_EDIT.jpg', label: 'Rooftop Pool' },
      { src: 'XC190-HdM-637-Tirana_2406_CI_IM08_Tower view_009b.jpg', label: 'Tower View 2' },
      { src: 'XC190-HdM-637-Tirana_2412_CI_IM16_Ground floor side_006a.jpg', label: 'Ground Floor Side' }
    ];

    let currentIndex = 0;
    const img = document.getElementById('displayed-image');
    const label = document.getElementById('image-label');

    function showImage(index) {
      if (index < 0) index = imageList.length - 1;
      if (index >= imageList.length) index = 0;
      currentIndex = index;
      img.src = imageList[currentIndex].src;
      label.textContent = imageList[currentIndex].label;
    }

    function resizeImage() {
      const vpHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const labelHeight = label.offsetHeight + 16;
      const availableHeight = vpHeight - labelHeight;
      img.style.maxHeight = `${availableHeight}px`;
    }

    document.getElementById('prev').onclick = () => showImage(currentIndex - 1);
    document.getElementById('next').onclick = () => showImage(currentIndex + 1);

    window.addEventListener('resize', resizeImage);
    img.addEventListener('load', resizeImage);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeImage, 300);
    });

    window.onload = () => showImage(0);
  </script>
</body>
</html>
