<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Herzog & de Meuron | 637_Static Render Viewer</title>
      <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    /* Custom font */
    @font-face {
      font-family: 'ABCGravity';
      src: url('ABCGravity-Normal.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      height: 100%;
      overflow: hidden;
      font-family: 'ABCGravity', sans-serif;
      color: white;
      touch-action: manipulation;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main viewer hidden by default, fades in */
    #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-height: 100vh;
      max-width: 100vw;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #viewer.visible {
      visibility: visible;
      opacity: 1;
    }

    /* Image container (for centering image only) */
    #image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100vw;
    }

    #displayed-image {
      display: block;
      max-width: 100vw;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .arrow {
      position: fixed;
      top: 50%; 
      transform: translateY(-50%);
      font-size: 1.5rem;
      color: white;
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 999;
    }

    #prev {
      left: clamp(10px, 3vw, 30px);
    }

    #next {
      right: clamp(10px, 3vw, 30px);
    }

    .arrow:active {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <button class="arrow" id="prev">&lt;</button>
  <div id="viewer">
    <div id="image-container">
      <img id="displayed-image" src="" alt="Image Viewer" />
    </div>
  </div>
  <button class="arrow" id="next">&gt;</button>

  <script>
    const imageList = [
      { src: 'boulevard_11.jpg' },
      { src: 'east_02.jpg' },
      { src: 'event_space_07.jpg' },
      { src: 'looking_up_17_dusk.jpg' },
      { src: 'street_elevation_11.jpg' },
      { src: 'street_level_12.jpg' },
      { src: 'XC190-HdM637_IM_2406_IM07_Tower view_013d.jpg' },
      { src: 'XC190-HdM637_IM_2412_IM17_Rooftop_pool_3_004b_EDIT.jpg' },
      { src: 'XC190-HdM-637-Tirana_2406_CI_IM08_Tower view_009b.jpg' },
      { src: 'XC190-HdM-637-Tirana_2412_CI_IM16_Ground floor side_006a.jpg' }
    ];

    let currentIndex = 0;
    const img = document.getElementById('displayed-image');
    const viewer = document.getElementById('viewer');

    function showImage(index) {
      if (index < 0) index = imageList.length - 1;
      if (index >= imageList.length) index = 0;
      currentIndex = index;
      viewer.classList.remove('visible'); // hide viewer while loading
      img.src = imageList[currentIndex].src;
    }

    function resizeImage() {
      const vpHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      img.style.maxHeight = `${vpHeight - 32}px`;
    }

    img.addEventListener('load', () => {
      resizeImage();
      viewer.classList.add('visible'); // fade in viewer after image loads
    });

    window.addEventListener('resize', resizeImage);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeImage, 300);
    });

    document.getElementById('prev').onclick = () => showImage(currentIndex - 1);
    document.getElementById('next').onclick = () => showImage(currentIndex + 1);

    window.onload = () => showImage(0);
  </script>
</body>
</html>
