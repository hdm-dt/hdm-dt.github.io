<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
  <meta charset="UTF-8">
  <title>Herzog & de Meuron | 637_Mood Board</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      touch-action: none;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    img {
      touch-action: none;
      max-width: none;
      user-select: none;
      will-change: transform;
      transform-origin: center center;
      display: block;
      position: absolute;
      transition: transform 0.05s ease-out;
    }
  </style>
</head>
<body>
  <div id="container">
    <img id="zoom-image" src="637_REP-3_Process Moodboards 2.png" alt="Zoomable">
  </div>

  <script>
    const img = document.getElementById('zoom-image');
    const container = document.getElementById('container');

    let scale = 1;
    let minScale = 1;
    let maxScale = 5;
    let lastScale = 1;

    let posX = 0, posY = 0;
    let lastX = 0, lastY = 0;
    let startX = 0, startY = 0;
    let initialDistance = null;

    let imgWidth = 0;
    let imgHeight = 0;

    function getDistance(touches) {
      const [t1, t2] = touches;
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateTransform() {
      const displayWidth = imgWidth * scale;
      const displayHeight = imgHeight * scale;
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;

      const maxOffsetX = Math.max(0, (displayWidth - containerWidth) / 2);
      const maxOffsetY = Math.max(0, (displayHeight - containerHeight) / 2);

      posX = clamp(posX, -maxOffsetX, maxOffsetX);
      posY = clamp(posY, -maxOffsetY, maxOffsetY);

      img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    img.onload = () => {
      const containerWidth = container.clientWidth;
      imgWidth = img.naturalWidth;
      imgHeight = img.naturalHeight;

      minScale = containerWidth / imgWidth;
      scale = minScale;
      lastScale = scale;
      posX = 0;
      posY = 0;

      updateTransform();
    };

    img.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        lastScale = scale;
      } else if (e.touches.length === 1) {
        const touch = e.touches[0];
        startX = touch.clientX - lastX;
        startY = touch.clientY - lastY;
      }
    });

    img.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (e.touches.length === 2) {
        const [t1, t2] = e.touches;
        const newDistance = getDistance(e.touches);
        const newScale = lastScale * (newDistance / initialDistance);
        const clampedScale = clamp(newScale, minScale, maxScale);

        // Pinch midpoint (screen space)
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;

        // Translate midpoint to image space
        const rect = container.getBoundingClientRect();
        const imgMidX = midX - rect.left - posX;
        const imgMidY = midY - rect.top - posY;

        // Adjust offset based on scale change
        const scaleChange = clampedScale / scale;
        posX -= imgMidX * (scaleChange - 1);
        posY -= imgMidY * (scaleChange - 1);

        scale = clampedScale;
        updateTransform();

      } else if (e.touches.length === 1) {
        const touch = e.touches[0];
        posX = touch.clientX - startX;
        posY = touch.clientY - startY;
        updateTransform();
      }
    });

    img.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        lastX = posX;
        lastY = posY;
      }
    });
  </script>
</body>
</html>
